name: Portable MS components
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: thumbv8m.main-none-eabihf
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test -p tetra-ms-types -p tetra-ms-core --features std
      - run: cargo test -p tetra-phy-core
      - run: cargo test -p tetra-ms-ffi --features c-smoke
      - run: cargo test -p tetra-ms-ffi --features std,c-smoke
      - run: cargo clippy -p tetra-ms-types -p tetra-ms-core -p tetra-ms-ffi -p tetra-phy-core --all-targets --all-features -- -D warnings
      - run: cargo build -p tetra-ms-core -p tetra-ms-ffi -p tetra-phy-core --no-default-features --target thumbv8m.main-none-eabihf
      - run: cargo build -p tetra-ms-core --no-default-features --example embedded --target thumbv8m.main-none-eabihf
      - run: cargo rustc -p tetra-ms-ffi --lib --release --target thumbv8m.main-none-eabihf --features standalone --crate-type staticlib -- -C panic=abort
      - name: Link all component C callers without libc
        run: |
          clang --target=arm-none-eabihf -mcpu=cortex-m33 -mthumb -mfloat-abi=hard -mfpu=fpv5-sp-d16 -Os -ffunction-sections -fdata-sections -ffreestanding -std=c11 -Icrates/tetra-ms-ffi/include -nostdlib -fuse-ld=lld -Wl,-e,main -Wl,--gc-sections crates/tetra-ms-ffi/tests/all_smoke_main.c crates/tetra-ms-ffi/tests/*smoke.c target/thumbv8m.main-none-eabihf/release/libtetra_ms_ffi.a -o portable-ms-smoke.elf
          llvm-size portable-ms-smoke.elf
          test -z "$(llvm-nm --undefined-only portable-ms-smoke.elf)"
      - name: Check embedded C and C++ header layouts
        run: |
          for source in crates/tetra-ms-ffi/tests/*smoke.c; do
            clang --target=arm-none-eabi -mcpu=cortex-m33 -mthumb -ffreestanding -std=c11 -fsyntax-only -Werror -Icrates/tetra-ms-ffi/include "$source"
            clang --target=arm-none-eabi -mcpu=cortex-m33 -mthumb -ffreestanding -x c++ -std=c++11 -fsyntax-only -Werror -Icrates/tetra-ms-ffi/include "$source"
          done

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install desktop link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsoapysdr-dev pkg-config clang libclang-dev
      - run: cargo test --workspace --locked
      - name: Check the reference interface server
        run: |
          python -m pip install "websockets>=14"
          python examples/ms-interface/reference-client.py --help

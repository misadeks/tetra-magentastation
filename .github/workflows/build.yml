name: Build MS desktop binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsoapysdr-dev pkg-config clang libclang-dev
      - run: cargo build --locked --release -p magentastation --bin magentastation
      - run: ./target/release/magentastation --help
      - uses: actions/upload-artifact@v4
        with:
          name: magentastation-linux-${{ matrix.architecture }}
          path: target/release/magentastation
